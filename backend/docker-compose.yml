services:
  postgres:
    image: postgres:15-alpine
    container_name: sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms_password
      POSTGRES_DB: sms
    ports:
      - '5432:5432'
    volumes:
      - sms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sms']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - sms_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: apply Prisma migrations, then exit. Uses the build stage which
  # still contains the Prisma CLI (the lean runtime image does not).
  migrate:
    build:
      context: .
      target: build
    container_name: sms-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://sms:sms_password@postgres:5432/sms?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # The API. In-container it talks to postgres/redis by service name (not localhost).
  # Secrets fall back to dev defaults but can be overridden via backend/.env.
  api:
    build:
      context: .
    container_name: sms-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://sms:sms_password@postgres:5432/sms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  sms_pgdata:
  sms_redisdata:
